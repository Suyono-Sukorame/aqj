[workspace]
resolver = "2"
members = [
    "crates/aqj-core",
    "crates/aqj-src",
    "crates/aqj-install",
    "crates/aqj-remove",
    "crates/aqj-query",
    "crates/aqj-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["AQJ Developers"]
license = "GPL-3.0-or-later"
repository = "https://github.com/Suyono-Sukorame/aqj"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
tar = "0.4"
flate2 = "1.0"
zstd = "0.13"
sha2 = "0.10"
clap = { version = "4.4", features = ["derive"] }
ureq = { version = "2.9", features = ["json"] }
walkdir = "2.4"
anyhow = "1.0"
thiserror = "1.0"
log = "0.4"
env_logger = "0.10"
